<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
        padding: 0;
        }
        .container{
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 80px 40px 1fr 40px;
            grid-template-columns:1fr 150px;
            gap: 5px;
        }

        .item1{
            background-color: blueviolet;
            grid-area: 1/1/2/-1;
            text-align: center;
            align-content: center;
            color: white;
        }
        .item2{
            background-color: blue;
            grid-area: 2/1/3/-1;
            text-align: center;
            color: white;
            align-content: center;
        }

        .item3{
            background-color: black;
            grid-area: 3/1/-3/2;
            color: white;
            text-align: center;
            align-content: center;
        }
        .item4{
            background-color: aqua;
            color: white;
            grid-area: 3/2/-2/3;
            text-align: center;
            align-content: center;

        }
        .item5{
            background-color: gray;
            color: white;
            grid-area: 4/1/-1/-1;
            text-align: center;
            align-content: center;
        }
    </style>
</head>
<body>
   <main class="container">
    <div class="item1">TOPO</div>
    <div class="item2">MENU</div>
    <div class="item3">PRINCIPAL</div>
    <div class="item4">SECUNDARIO</div>
    <div class="item5">RODAPE</div>

   </main>
    
</body>
</html>
